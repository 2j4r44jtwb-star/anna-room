<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anna Room</title>
<style>
:root{--text:#f7f5ff;--muted:#b9b5ca;--blue:#8ebfff;--violet:#c4a7ff;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);background:radial-gradient(circle at 10% -10%,rgba(142,191,255,.35),transparent 34%),radial-gradient(circle at 100% 12%,rgba(196,167,255,.22),transparent 28%),linear-gradient(180deg,#0a0d1b,#05060b 72%)}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.24) 1px,transparent 1px);background-size:42px 42px;opacity:.16;pointer-events:none}
.phone{max-width:480px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px;backdrop-filter:blur(18px)}
.kicker{margin:0 0 4px;color:var(--blue);font-size:11px;letter-spacing:.22em}
h1{font-size:22px;margin:0} h2{font-size:28px;line-height:1.25;margin:0 0 10px} h3{font-size:17px;margin:0 0 14px}
p{line-height:1.65;color:var(--muted)}
.screen{display:none;animation:fade .25s ease}.screen.active{display:block}@keyframes fade{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));border:1px solid var(--line);box-shadow:0 22px 60px rgba(0,0,0,.32);backdrop-filter:blur(18px);border-radius:28px;padding:20px;margin:14px 0}
.hero{min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,rgba(142,191,255,.24),rgba(196,167,255,.12) 45%,rgba(255,255,255,.04))}
.hero.small{min-height:132px}.date{color:var(--blue);font-size:13px;margin:0 0 8px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section-head h3{margin:0}.section-head span,#moodBadge{border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--blue);font-size:12px;background:rgba(142,191,255,.08)}
.mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{border:1px solid var(--line);background:rgba(255,255,255,.075);color:var(--text);border-radius:16px;padding:13px 10px;font-size:14px}button:active{transform:scale(.98)}
.pill.selected{background:linear-gradient(135deg,rgba(142,191,255,.38),rgba(196,167,255,.30));border-color:rgba(255,255,255,.24)}
.reply{margin:14px 0 0;color:var(--text);background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:13px}.reply.big{font-size:16px}
.tasks{display:grid;gap:10px}.tasks label{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.14);border:1px solid rgba(255,255,255,.08);padding:13px;border-radius:18px}
input[type=checkbox]{width:22px;height:22px;accent-color:#8ebfff}
.main-btn{width:100%;background:linear-gradient(135deg,var(--blue),var(--violet));color:#08101d;font-weight:800;border:0;box-shadow:0 14px 30px rgba(142,191,255,.18)}.main-btn.secondary{margin-top:10px;background:rgba(142,191,255,.15);color:var(--text);border:1px solid rgba(142,191,255,.28);box-shadow:none}
textarea{width:100%;min-height:140px;resize:vertical;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.11);border-radius:20px;color:var(--text);padding:14px;font-size:16px;line-height:1.7;outline:none}
.menu{padding-left:22px;color:var(--muted);line-height:1.9}.timer-card{text-align:center}.timer{font-size:54px;font-weight:800;letter-spacing:.04em;margin:18px 0}.timer-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{font-size:13px;color:var(--blue);margin-bottom:0}
.icon-btn{width:44px;height:44px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);font-size:20px}
.tabbar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(448px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;border:1px solid var(--line);border-radius:24px;background:rgba(13,16,28,.82);backdrop-filter:blur(22px);box-shadow:0 16px 50px rgba(0,0,0,.38)}
.tab{border:0;background:transparent;color:var(--muted);border-radius:17px;padding:12px 6px;font-size:12px}.tab.active{background:rgba(142,191,255,.18);color:var(--text)}
</style>
</head>
<body>
<div class="phone">
<header class="topbar"><div><p class="kicker">ANNA ROOM</p><h1 id="greeting">こんばんは、杏菜</h1></div><button class="icon-btn" id="resetBtn">↺</button></header>
<main>
<section class="screen active" id="home">
<div class="glass hero"><p class="date" id="todayText"></p><h2>今日は、壊れないだけで勝ち。</h2><p>歌・配信・美容・お金・気持ち。全部完璧じゃなくていい。ひとつだけ触る。</p></div>
<div class="glass"><div class="section-head"><h3>今のモード</h3><span id="moodBadge">未選択</span></div><div class="mood-grid"><button class="pill" data-mood="dark">重い</button><button class="pill" data-mood="anxious">不安</button><button class="pill" data-mood="flat">普通</button><button class="pill" data-mood="light">少し良い</button></div><p class="reply" id="moodReply">いまの気分を押してね。</p></div>
<div class="glass"><div class="section-head"><h3>今日の最低ライン</h3><span id="progress">0/5</span></div><div class="tasks"><label><input type="checkbox" data-task="water"><span>水を飲む</span></label><label><input type="checkbox" data-task="skin"><span>保湿する</span></label><label><input type="checkbox" data-task="outside"><span>5分だけ外に出る</span></label><label><input type="checkbox" data-task="voice"><span>10分だけ声を出す</span></label><label><input type="checkbox" data-task="money"><span>お金を1個だけ記録</span></label></div></div>
</section>
<section class="screen" id="create"><div class="glass hero small"><h2>世界観を出す日</h2><p>無理に明るくしない。青、夜、透明感、低い声。</p></div><div class="glass"><h3>配信・投稿ガチャ</h3><button class="main-btn" id="ideaBtn">今日の一手を出す</button><p class="reply big" id="ideaText">押すと、軽くできる案が出る。</p></div><div class="glass"><h3>言葉メモ</h3><textarea id="phrase" placeholder="歌詞、投稿文、今の気持ち、残したい言葉"></textarea><button class="main-btn secondary" id="savePhrase">保存</button><p class="mini" id="phraseStatus"></p></div></section>
<section class="screen" id="voice"><div class="glass hero small"><h2>声を整える</h2><p>上手くなる日じゃなくて、声と仲直りする日。</p></div><div class="glass"><h3>10分メニュー</h3><button class="main-btn" id="menuBtn">メニューを作る</button><ol id="voiceMenu" class="menu"></ol></div><div class="glass timer-card"><h3>10:00 タイマー</h3><div class="timer" id="timer">10:00</div><div class="timer-actions"><button id="startTimer">Start</button><button id="pauseTimer">Pause</button><button id="resetTimer">Reset</button></div></div></section>
<section class="screen" id="log"><div class="glass hero small"><h2>今日の記録</h2><p>ちゃんと生きた証拠を、ちょっとだけ残す。</p></div><div class="glass"><h3>ひとこと日記</h3><textarea id="diary" placeholder="今日できたこと / しんどかったこと / 明日の自分へ"></textarea><button class="main-btn" id="saveDiary">保存</button><p class="mini" id="diaryStatus"></p></div></section>
</main>
<nav class="tabbar"><button class="tab active" data-tab="home">Home</button><button class="tab" data-tab="create">Create</button><button class="tab" data-tab="voice">Voice</button><button class="tab" data-tab="log">Log</button></nav>
</div>
<script>
const keyDate=new Date().toISOString().slice(0,10),$=q=>document.querySelector(q),$$=q=>document.querySelectorAll(q);
const hour=new Date().getHours();$("#greeting").textContent=hour<5?"まだ夜だね、杏菜":hour<12?"おはよう、杏菜":hour<18?"こんにちは、杏菜":"こんばんは、杏菜";
$("#todayText").textContent=new Intl.DateTimeFormat("ja-JP",{month:"long",day:"numeric",weekday:"long"}).format(new Date());
const moodMap={dark:["重い","今日は“何もしない”じゃなくて、“崩れないようにしてる”日。水と保湿だけで合格。"],anxious:["不安","決断を増やさない。小さい行動を1個だけ。5分外に出るか、10分声を出す。"],flat:["普通","普通はかなり強い。淡々と1個だけ積むと、明日の自分が少し楽になる。"],light:["少し良い","その波、使える。配信か投稿メモを少しだけ。全部出さずに“気配”でいい。"]};
function setMood(mood){localStorage.setItem(`mood-${keyDate}`,mood);const[label,text]=moodMap[mood];$("#moodBadge").textContent=label;$("#moodReply").textContent=text;$$("[data-mood]").forEach(b=>b.classList.toggle("selected",b.dataset.mood===mood))}
$$("[data-mood]").forEach(b=>b.addEventListener("click",()=>setMood(b.dataset.mood)));const savedMood=localStorage.getItem(`mood-${keyDate}`);if(savedMood)setMood(savedMood);
function updateTasks(){let done=0;$$("[data-task]").forEach(c=>{const key=`task-${keyDate}-${c.dataset.task}`;c.checked=localStorage.getItem(key)==="1";if(c.checked)done++});$("#progress").textContent=`${done}/5`}
$$("[data-task]").forEach(c=>c.addEventListener("change",()=>{localStorage.setItem(`task-${keyDate}-${c.dataset.task}`,c.checked?"1":"0");updateTasks()}));updateTasks();
const ideas=["20分だけ配信。タイトルは『少しだけいる』。盛り上げなくていい、存在だけ置く。","ストーリー：イヤホン、手元、青い光。顔を出さずに“今作ってる人”の気配。","X：『今日は声を少しだけ整えた』。成果報告じゃなく、物語の断片にする。","写真：真正面じゃなく横顔寄り。青・黒・白のどれかだけ。説明文は絵文字1つ。","歌メモ：低い声で似合う1フレーズを録る。公開しなくていい。素材として残す。"];
$("#ideaBtn").addEventListener("click",()=>{$("#ideaText").textContent=ideas[Math.floor(Math.random()*ideas.length)]});
const menus=[["肩と首をゆるめる 1分","リップロール 2分","ウーで低〜中音 3分","Aメロだけ小さく歌う 3分","良かった一音をメモ 1分"],["ハミング 2分","息だけでフレーズ確認 2分","母音『う→お』 2分","サビ前まで軽く 3分","録音を1回だけ聴く 1分"],["顎を落として無音呼吸 1分","リップロールで1曲の一部 3分","低い声で朗読 2分","同じ響きで歌う 3分","喉の疲れチェック 1分"]];
$("#menuBtn").addEventListener("click",()=>{const menu=menus[Math.floor(Math.random()*menus.length)];$("#voiceMenu").innerHTML=menu.map(x=>`<li>${x}</li>`).join("")});
let seconds=600,timerId=null;function renderTimer(){const m=String(Math.floor(seconds/60)).padStart(2,"0"),s=String(seconds%60).padStart(2,"0");$("#timer").textContent=`${m}:${s}`}
$("#startTimer").addEventListener("click",()=>{if(timerId)return;timerId=setInterval(()=>{if(seconds>0){seconds--;renderTimer()}else{clearInterval(timerId);timerId=null}},1000)});
$("#pauseTimer").addEventListener("click",()=>{clearInterval(timerId);timerId=null});$("#resetTimer").addEventListener("click",()=>{clearInterval(timerId);timerId=null;seconds=600;renderTimer()});renderTimer();
$("#phrase").value=localStorage.getItem(`phrase-${keyDate}`)||"";$("#savePhrase").addEventListener("click",()=>{localStorage.setItem(`phrase-${keyDate}`,$("#phrase").value);$("#phraseStatus").textContent="保存した。言葉はちゃんと残ってる。"});
$("#diary").value=localStorage.getItem(`diary-${keyDate}`)||"";$("#saveDiary").addEventListener("click",()=>{localStorage.setItem(`diary-${keyDate}`,$("#diary").value);$("#diaryStatus").textContent="保存した。今日の杏菜、消えてない。"});
$$(".tab").forEach(tab=>{tab.addEventListener("click",()=>{$$(".tab").forEach(t=>t.classList.remove("active"));$$(".screen").forEach(s=>s.classList.remove("active"));tab.classList.add("active");$("#"+tab.dataset.tab).classList.add("active")})});
$("#resetBtn").addEventListener("click",()=>{if(!confirm("今日のチェックと気分をリセットする？"))return;Object.keys(localStorage).forEach(k=>{if(k.includes(keyDate)&&(k.startsWith("task-")||k.startsWith("mood-")))localStorage.removeItem(k)});$("#moodBadge").textContent="未選択";$("#moodReply").textContent="いまの気分を押してね。";$$("[data-mood]").forEach(b=>b.classList.remove("selected"));updateTasks()});
</script>
</body>
</html>
