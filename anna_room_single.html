<!doctype html>

<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anna Song Room</title>
<style>
body{
margin:0;
font-family:-apple-system,sans-serif;
background:#050713;
color:white;
padding:20px;
}
.card{
background:#111827;
border-radius:20px;
padding:20px;
margin-bottom:20px;
}
button{
width:100%;
padding:14px;
border:0;
border-radius:14px;
background:#8ec5ff;
font-weight:bold;
margin-top:10px;
}
textarea,input{
width:100%;
padding:12px;
border-radius:12px;
border:0;
margin-top:10px;
background:#1f2937;
color:white;
}
</style>
</head>
<body>
<div class="card">
<h1>🎵 Anna Song Room</h1>
<p>曲の種を残す場所</p>
</div>
<div class="card">
<h2>タイトル</h2>
<input id="title" placeholder="曲タイトル">
<h2>歌詞メモ</h2>
<textarea id="lyrics"></textarea>
<button onclick="saveSong()">保存</button>
<p id="saved"></p>
</div>
<div class="card">
<h2>コード進行</h2>
<button onclick="makeChord()">生成</button>
<p id="chord"></p>
</div>
<script>
function saveSong(){
localStorage.setItem(
"song",
JSON.stringify({
title:document.getElementById("title").value,
lyrics:document.getElementById("lyrics").value
})
);
document.getElementById("saved").innerText="保存した";
}
function makeChord(){
const chords=[
"Am - F - C - G",
"Em - C - G - D",
"Fm - Db - Ab - Eb",
"Cmaj7 - Em7 - Am7 - Fmaj7"
];
document.getElementById("chord").innerText=
chords[Math.floor(Math.random()*chords.length)];
}
window.onload=()=>{
const data=JSON.parse(localStorage.getItem("song")||"{}");
document.getElementById("title").value=data.title||"";
document.getElementById("lyrics").value=data.lyrics||"";
}
</script>
</body>
</html>
